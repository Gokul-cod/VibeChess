# Publishes the static VibeChess app to GitHub Pages.
#
# The API is not here: Pages cannot run functions. Point the app at the API
# host with a repository variable (Settings -> Secrets and variables -> Actions
# -> Variables):
#
#   VIBECHESS_API_BASE = https://<your-api-host>     e.g. https://vibechess.netlify.app
#
# The API host must allow this Pages origin for cross-site requests, and it
# returns the session token in the sign-in response because browsers block
# third-party cookies:
#
#   Netlify:    VIBECHESS_ALLOWED_ORIGINS = https://<owner>.github.io
#   Cloudflare: ALLOWED_ORIGINS           = https://<owner>.github.io
name: Deploy VibeChess to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Check the API origin is configured
        if: vars.VIBECHESS_API_BASE == ''
        run: |
          echo "::error::Add a repository variable VIBECHESS_API_BASE with the API origin, for example https://vibechess.netlify.app"
          exit 1

      # Project sites live at /<repo>/; a <owner>.github.io repository is at /.
      - name: Work out the base path
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "VITE_BASE=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          fi

      - name: Build the static app
        run: npm run build:pages
        env:
          VITE_API_BASE: ${{ vars.VIBECHESS_API_BASE }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
